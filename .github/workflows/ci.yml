name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  artifacts:
    name: Build PGlite artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the pglite pin
        id: pin
        run: |
          source pglite.env
          echo "repository=${POSTGRES_PGLITE_REPOSITORY:-${{ github.repository_owner }}/postgres-pglite}" >> "$GITHUB_OUTPUT"
          echo "ref=$POSTGRES_PGLITE_REF" >> "$GITHUB_OUTPUT"
          echo "version=$PGLITE_VERSION" >> "$GITHUB_OUTPUT"
          echo "cache-key=pglite-artifacts-$POSTGRES_PGLITE_REF-$PGLITE_VERSION-${{ hashFiles('scripts/*') }}" >> "$GITHUB_OUTPUT"

      - name: Cache artifacts
        id: cache
        uses: actions/cache@v6
        with:
          path: src/pytest_pglite/_artifacts
          key: ${{ steps.pin.outputs.cache-key }}

      - name: Check out postgres-pglite
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.ref }}
          path: postgres-pglite

      # the extensions the standalone build includes from submodules
      - name: Check out pgtap
        if: steps.cache.outputs.cache-hit != 'true'
        run: git -C postgres-pglite submodule update --init --depth 1 pglite/other_extensions/pgtap

      - name: Build the standalone module
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: postgres-pglite
        run: |
          mkdir -p dist
          PGLITE_VERSION=${{ steps.pin.outputs.version }} \
          BUILD_SCRIPT=./build-pglite-standalone.sh \
          ./build-with-docker.sh

      # for running initdb (python -m pytest_pglite._initdb)
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.cache.outputs.cache-hit != 'true'

      - name: Collect artifacts
        if: steps.cache.outputs.cache-hit != 'true'
        run: POSTGRES_PGLITE="$PWD/postgres-pglite" scripts/fetch-artifacts.sh

      - uses: actions/upload-artifact@v7
        with:
          name: pglite-artifacts
          path: src/pytest_pglite/_artifacts
          if-no-files-found: error

  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    needs: artifacts
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # no Windows: CPython has no AF_UNIX sockets there
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: pglite-artifacts
          path: src/pytest_pglite/_artifacts

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Test
        run: uv run --locked pytest -v

  build:
    name: Build package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: pglite-artifacts
          path: src/pytest_pglite/_artifacts

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Build
        run: uv build

      - name: Test the installed wheel
        run: |
          uv venv /tmp/wheel-venv
          uv pip install --python /tmp/wheel-venv "$(ls dist/*.whl)[psycopg]" pytest
          cd "$(mktemp -d)"
          cat > test_installed.py <<'EOF'
          def test_query(pglite_connection):
              assert pglite_connection.execute("SELECT 1").fetchone() == (1,)
          EOF
          /tmp/wheel-venv/bin/python -m pytest -q test_installed.py

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
