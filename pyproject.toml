[project]
name = "pglite-wasm"
version = "0.1.0"
description = "In-memory Postgres (PGlite) for Python tests, running in-process on wasmtime"
readme = "README.md"
license = "Apache-2.0 AND PostgreSQL"
license-files = ["LICENSE", "licenses/*"]
requires-python = ">=3.12"
keywords = ["postgres", "postgresql", "pglite", "wasm", "wasmtime", "testing", "pytest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "wasmtime>=49.0.0",
]

[project.optional-dependencies]
psycopg = ["psycopg>=3.1"]
sqlalchemy = ["sqlalchemy>=2.0", "psycopg>=3.1"]

[project.entry-points.pytest11]
pglite = "pglite_wasm.pytest_plugin"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "sqlalchemy>=2.1.1",
]

[tool.pytest.ini_options]
addopts = "-p pytester"

[tool.uv.build-backend]
# the sdist builds without Node or the WASM toolchain: it carries the artifacts too
source-include = ["tests/**", "scripts/**"]
